name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vanblue
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"
  DEPLOY_HOST: vanblue.online
  DEPLOY_USER: deployer
  SITE_URL: https://vanblue.online/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSL -o /tmp/zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/zola-v$ZOLA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/zola.tar.gz -C /tmp
          sudo install -m 755 /tmp/zola /usr/local/bin/zola
          zola --version

      - name: Build site
        run: zola build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: "vanblue.online,119.91.46.167 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHq8MwyQBupVk4mfDodG2rZuyE3znriYcEtc8fge6Ja8"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: Deploy over SSH
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::DEPLOY_SSH_KEY is not set - build only, nothing deployed"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf "%s\n" "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          tar czf - -C public . | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST"
          rm -f ~/.ssh/deploy_key

      - name: Smoke test the live site
        if: ${{ env.SSH_KEY != '' }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null "$SITE_URL" && echo "live OK"

