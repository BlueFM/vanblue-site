# vanblue.online — static academic site
# managed by hand; TLS files are issued and renewed by certbot

server {
    listen 80;
    listen [::]:80;
    server_name vanblue.online www.vanblue.online;

    return 301 https://vanblue.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vanblue.online;

    ssl_certificate     /etc/letsencrypt/live/vanblue.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanblue.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vanblue/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/xml application/atom+xml image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    access_log /var/log/nginx/vanblue.access.log;
    error_log  /var/log/nginx/vanblue.error.log warn;

    location ~* \.(css|js|mjs|woff2?|ttf|png|jpe?g|gif|svg|webp|avif|ico|pdf)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vanblue.online;

    ssl_certificate     /etc/letsencrypt/live/vanblue.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanblue.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vanblue.online$request_uri;
}
