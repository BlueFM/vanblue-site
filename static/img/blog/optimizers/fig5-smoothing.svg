<title id="t">A noisy gradient signal and the same signal smoothed once and twice</title>
<desc id="d">A synthetic gradient signal with a slow trend and fast jitter, then the same signal after one and after two averaging stages. The second stage follows the trend and ignores the jitter; it also lags behind it.</desc>
