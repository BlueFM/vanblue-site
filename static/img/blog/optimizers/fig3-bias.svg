<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
<title id="t">Bias of the exponential average in the first steps of Adam</title>
<desc id="d">With a constant gradient of one, the raw first-moment estimate rises as 1 - beta^t; dividing by the same factor puts it at one immediately. With a slower beta the biased stretch lasts hundreds of steps, which is why the correction matters most at the start of training.</desc>
<style>text{font-family:'Trebuchet MS', Helvetica, Arial, sans-serif;}</style>
