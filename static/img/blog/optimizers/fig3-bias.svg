<text x="522.1" y="307.0" font-size="11.5" fill="#7a8288" text-anchor="middle" font-weight="400">50</text>
<line x1="614.0" y1="291.0" x2="614.0" y2="295.0" stroke="#b3b8bb" stroke-width="1"/>
