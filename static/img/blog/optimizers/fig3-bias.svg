<text x="62.0" y="176.6" font-size="11.5" fill="#7a8288" text-anchor="end" font-weight="400">0.50</text>
<line x1="72.0" y1="116.6" x2="614.0" y2="116.6" stroke="#f0f1f2" stroke-width="1"/>
<text x="62.0" y="120.2" font-size="11.5" fill="#7a8288" text-anchor="end" font-weight="400">0.75</text>
<line x1="72.0" y1="60.1" x2="614.0" y2="60.1" stroke="#f0f1f2" stroke-width="1"/>
<text x="62.0" y="63.7" font-size="11.5" fill="#7a8288" text-anchor="end" font-weight="400">1.00</text>
<rect x="72.0" y="42.0" width="91.9" height="244.0" rx="0" fill="#224b8d" stroke="none" stroke-width="1" opacity="0.045"/>
<text x="78.0" y="56.0" font-size="11.5" fill="#224b8d" text-anchor="start" font-weight="400" opacity="0.9">first ~1/(1-beta) steps</text>
