<line x1="72.0" y1="229.5" x2="614.0" y2="229.5" stroke="#f0f1f2" stroke-width="1"/>
<text x="62.0" y="233.1" font-size="11.5" fill="#7a8288" text-anchor="end" font-weight="400">0.25</text>
