<title id="t">Two coordinates whose curvatures differ by four orders of magnitude</title>
<desc id="d">Distance to the optimum against step number for gradient descent and Adam on a quadratic whose two coordinates have curvatures 100 and 0.01. Gradient descent collapses the steep coordinate and leaves the flat one untouched; Adam moves both at the same rate until it reaches the floor set by its step size.</desc>
