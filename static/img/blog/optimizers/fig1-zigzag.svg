<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
<title id="t">Gradient descent and momentum on an elongated valley</title>
<desc id="d">On a narrow quadratic valley, gradient descent with a stable step size bounces across the valley at every step and then crawls along it, still 0.4 units from the bottom only after fifty-odd steps. Heavy-ball momentum at almost the same step size crosses the valley once and reaches the bottom in about twenty.</desc>
