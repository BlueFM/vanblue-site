<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moonlit Grimoire — share-cover source</title>
<link rel="icon" href="../static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../static/css/style.css"><link rel="stylesheet" href="../static/css/moonlit.css">
<style>
html,body{width:1200px;height:630px;min-height:0;margin:0;overflow:hidden}
.og-page{position:absolute;inset:38px 42px;display:grid;grid-template-columns:minmax(0,1fr) 270px;align-items:center;gap:32px;padding:44px;background:var(--paper);border:1px solid var(--gold);border-radius:9px}
.og-page::before{content:"";position:absolute;inset:9px;border:1px solid #b7955e70;border-radius:4px;pointer-events:none}
.og-page h1{margin:20px 0 24px;font-size:68px;line-height:1.03;letter-spacing:-.055em}
.og-role{margin-bottom:24px;font-size:15px;line-height:1.9}
.og-role span{display:block;color:var(--muted);font-size:13px}
.og-threads{max-width:34rem;color:var(--muted);font:22px/1.55 var(--reading)}
.og-address{margin:30px 0 0;color:var(--gold-ink);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.og-page .exlibris{width:270px;max-width:none;min-height:354px}
.og-page .exlibris-map{width:280px;top:24px}
</style>
</head>
<body class="moonlit"><div class="night-sky" aria-hidden="true"></div>
<main class="og-page">
  <div>
    <p class="folio-kicker">Moonlit field notes / Optimization &amp; learning</p>
    <h1>Shunbao Zhang</h1>
    <p class="og-role">MSc student, Software Engineering<span>Lanzhou University · School of Artificial Intelligence</span></p>
    <p class="og-threads">Optimization. Generalization. Robustness.<br>A little wonder in the margins.</p>
    <p class="og-address">vanblue.online</p>
  </div>
  <div class="exlibris" aria-hidden="true">
    <p class="exlibris-label">Ex libris</p>
    <img class="exlibris-map" src="../static/img/moonlit/astrolabe.svg" alt="" width="400" height="400">
    <div class="exlibris-seal"><img src="../static/img/avatar-cat.jpg" alt="" width="128" height="128"></div>
    <p class="exlibris-caption">A curious mind.<span>Research, under the same stars.</span></p>
  </div>
</main>
</body>
</html>
